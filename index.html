<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة الزي العماني التقليدي</title>
<style>
:root{--red:#9e1b2c;--green:#1f4d3a;--gold:#c99a2e;--cream:#fbf5ea;--ink:#3a2a22}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);
background:radial-gradient(circle at 20% 10%,#fff 0,var(--cream) 45%,#f1e2c8 100%);
display:flex;flex-direction:column;align-items:center;padding:14px}
h1{margin:4px 0 2px;font-size:clamp(20px,4vw,32px);color:var(--red)}
p.sub{margin:0 0 12px;font-size:clamp(14px,2.4vw,18px);color:var(--green)}
.game{display:flex;gap:22px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;max-width:980px}
.stage{position:relative;height:min(78vh,760px);aspect-ratio:0.6928628708901363;max-width:100%;border:6px solid var(--gold);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(90,50,20,.25);background:#fff}
.stage img.bg{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.zone{position:absolute;border-radius:12px}
.zone.empty{background:rgba(251,245,234,.97);border:3px dashed var(--red);display:flex;align-items:center;justify-content:center;
font-size:clamp(18px,3vw,30px);color:var(--red);font-weight:700;transition:.2s}
.zone.hot{background:#fff3c9;transform:scale(1.04);box-shadow:0 0 0 4px rgba(201,154,46,.5)}
.zone.filled{border:0;background:center/100% 100% no-repeat;animation:pop .5s}
.zone.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(1.25);filter:brightness(1.4)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.side{flex:1;min-width:230px;max-width:300px;display:flex;flex-direction:column;gap:12px}
.tray{background:#fff;border:3px solid var(--green);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:200px}
.tray h2{margin:0;font-size:18px;color:var(--green);text-align:center}
.piece{touch-action:none;cursor:grab;background:var(--cream);border:2px solid var(--gold);border-radius:14px;padding:8px;text-align:center;user-select:none;transition:transform .15s}
.piece:hover{transform:translateY(-2px)}
.piece img{display:block;margin:0 auto;max-width:100%;max-height:110px;border-radius:8px;pointer-events:none}
.piece span{display:block;margin-top:6px;font-weight:700;color:var(--red);font-size:18px}
.piece.hide{visibility:hidden}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));transform:translate(-50%,-50%) scale(1.05);border-radius:10px}
#msg{min-height:44px;text-align:center;font-weight:700;font-size:18px;color:var(--green)}
#msg.bad{color:var(--red)}
button{font:inherit;background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer}
button:hover{background:#7f1423}
.win{position:fixed;inset:0;background:rgba(40,20,10,.6);display:none;align-items:center;justify-content:center;z-index:200}
.win.show{display:flex}
.win div{background:var(--cream);border:6px solid var(--gold);border-radius:24px;padding:28px 36px;text-align:center;max-width:90%}
.win h2{margin:0 0 8px;color:var(--red);font-size:30px}
</style>
</head>
<body>

const stage=document.getElementById('stage'),tray=document.getElementById('tray'),msg=document.getElementById('msg');
let left=0;
function say(t,bad){msg.textContent=t;msg.className=bad?'bad':''}
function init(){
  document.getElementById('win').classList.remove('show');
  stage.querySelectorAll('.zone').forEach(z=>z.remove());
  tray.querySelectorAll('.piece').forEach(p=>p.remove());
  const keys=Object.keys(DATA).sort(()=>Math.random()-.5);
  left=keys.length; say('');
  Object.entries(DATA).forEach(([k,d])=>{
    const z=document.createElement('div');z.className='zone empty';z.dataset.k=k;z.textContent='؟';
    Object.assign(z.style,{left:d.x+'%',top:d.y+'%',width:d.w+'%',height:d.h+'%'});stage.appendChild(z);
  });
  keys.forEach(k=>{
    const d=DATA[k],p=document.createElement('div');p.className='piece';p.dataset.k=k;
    p.innerHTML='<img src="'+d.img+'" alt=""><span>'+d.name+'</span>';
    p.addEventListener('pointerdown',e=>drag(e,p));tray.appendChild(p);
  });
}
function drag(e,p){
  e.preventDefault();
  const k=p.dataset.k,img=p.querySelector('img'),r=img.getBoundingClientRect();
  const g=img.cloneNode();g.className='ghost';g.style.width=r.width+'px';document.body.appendChild(g);
  p.classList.add('hide');
  const move=ev=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
    stage.querySelectorAll('.zone.empty').forEach(z=>{const b=z.getBoundingClientRect();
      z.classList.toggle('hot',ev.clientX>b.left&&ev.clientX<b.right&&ev.clientY>b.top&&ev.clientY<b.bottom)})};
  move(e);
  const up=ev=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    g.remove();let hit=null;
    stage.querySelectorAll('.zone').forEach(z=>{z.classList.remove('hot');const b=z.getBoundingClientRect();
      if(ev.clientX>b.left&&ev.clientX<b.right&&ev.clientY>b.top&&ev.clientY<b.bottom)hit=z});
    if(hit&&hit.classList.contains('empty')){
      if(hit.dataset.k===k){
        hit.className='zone filled';hit.textContent='';hit.style.backgroundImage='url('+DATA[k].img+')';
        p.remove();say('✔ أحسنتِ! هذا هو '+DATA[k].name);
        if(--left===0)setTimeout(()=>document.getElementById('win').classList.add('show'),700);
        return;
      }
      hit.classList.add('shake');setTimeout(()=>hit.classList.remove('shake'),400);
      say('✘ ليس هذا مكانها، حاولي مرة أخرى',true);
    }
    p.classList.remove('hide');
  };
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
document.getElementById('reset').onclick=init;
init();
</script>
